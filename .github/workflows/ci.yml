name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install rdkit numpy pyyaml pytest
      - run: python scripts/validate_structures.py --out /tmp/structures_validation.json
      - run: pytest -q tests
