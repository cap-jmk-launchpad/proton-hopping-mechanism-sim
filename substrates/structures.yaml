  F1_hd:
    name: heptane-2,6-dione
    role: "illustrative intramolecular aldol model of preprint v1.0 Scheme 1"
    smiles: "CC(=O)CCCC(C)=O"
    ref_formula: C7H12O2
    ref_mass: 128.083729621
    pubchem_cid: 100532
    source: PubChem 100532
  F1_hd_product:
    name: 3-methylcyclohex-2-en-1-one
    smiles: "CC1=CC(=O)CCC1"
    ref_formula: C7H10O
    ref_mass: 110.073164938
    pubchem_cid: 14511
    source: PubChem 14511
  F2_krohn_ring1:
    name: methyl 3-oxo-4-[2-(3-oxobutyl)phenyl]butanoate
    role: "stage-2 truncated fragment of S2 for the first ring closure (benzylic C4 -> C3'' ketone)"
    smiles: "COC(=O)CC(=O)Cc1ccccc1CCC(C)=O"
    ref_formula: C15H18O4
    ref_mass: null
    pubchem_cid: null
    source: "derived from S2 by replacing the anthraquinone with benzene and truncating 3,5-dioxohexyl to 3-oxobutyl"

wire_and_bases:   # all PubChem
  water: {smiles: "O", pubchem_cid: 962}
  methanol: {smiles: "CO", pubchem_cid: 887}
  isopropanol: {smiles: "CC(C)O", pubchem_cid: 3776, note: "solvent of the Krohn cyclisation (K2CO3, iPrOH/CH2Cl2)"}
  hydroxide: {smiles: "[OH-]"}
  methoxide: {smiles: "C[O-]"}
  trimethylamine: {smiles: "CN(C)C", pubchem_cid: 1146, note: "small stand-in for Et3N in stage 1"}

smarts:   # reaction-centre patterns; tests check the expected match counts
  active_methylene_13dicarbonyl: "[CX4;H2,H1]([CX3]=[OX1])[CX3]=[OX1]"
  benzylic_ketone_methylene: "[CX4;H2](c)[CX3](=[OX1])[#6]"
  ketone_electrophile: "[#6][CX3](=[OX1])[#6]"
  ester: "[CX3](=[OX1])[OX2][CH3]"
  enolate_carbanion: "[CX3-,CX4-]([CX3]=[OX1])[CX3]=[OX1]"
  alkoxide: "[OX1-][CX4]"
  epoxide: "[C;r3]1[O;r3][C;r3]1"
  aldol_ring_closure_rxn: "[C;H2,H1:1][C:2]=[O:3].[C:4]=[O:5]>>[C:1]([C:2]=[O:3])[C:4][O:5]"
