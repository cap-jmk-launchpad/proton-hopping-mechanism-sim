  F1_enolate:
    name: pentane-2,4-dionate (acac enolate)
    role: "stage-1 deprotonation product"
    smiles: "CC(=O)[CH-]C(C)=O"
    ref_formula: C5H7O2-
    ref_mass: 99.04515303
